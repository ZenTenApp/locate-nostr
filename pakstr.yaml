# Android build of the same `dist/` the web deploy serves, packaged by pakstr
# into a signed APK and published to Zapstore.
#
# The APK signing key is derived from PAKSTR_NSEC + appId and cannot be rotated
# once published: every future update must come from the same nsec and appId.
# Keep PAKSTR_NSEC in .env locally (gitignored) or in CI secrets, never here.

app:
  appId: com.nostrdev.nostrlocate
  appName: NostrBox Locate
  versionName: auto              # from the vX.Y.Z tag on HEAD (the release workflow's trigger)
  versionCode: auto              # derived from versionName: major*10000 + minor*100 + patch + 1
  description: Sweep every relay on the Nostr network for the kinds a chat client depends on.
  # Launcher icon: pakstr picks up ./logo.png on its own. The adaptive icon
  # shrinks it into Android's safe circle, so the ring around it is filled
  # with the logo's own blue rather than the default white.
  backgroundColor: "#0667FE"
  permissions: [INTERNET]

build:
  web: ./dist
  builder: docker

publish:
  upload:
    provider: blossom
    server: https://cdn.zapstore.dev
  zapstore:
    enabled: true
    source: upload
  relay: wss://relay.zapstore.dev
