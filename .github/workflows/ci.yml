name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks against the tag it is about to
  # publish, since the Release PR is opened by GITHUB_TOKEN and gets no CI.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
